name: Build OpenJDK 17 for Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build number (integer)'
        required: true
        default: 1
        type: number
      version-name:
        description: 'Display version (e.g., 17.0.1+12)'
        required: false
        type: string
      ecpkg-id:
        description: 'Package ID (e.g., jre17)'
        required: false
        default: jre17
        type: string
      ecpkg-name:
        description: 'Display name (e.g., OpenJDK 17)'
        required: false
        default: 'OpenJDK 17'
        type: string
      description:
        description: 'Package description'
        required: false
        type: string
      author:
        description: 'Package author'
        required: false
        default: 'EdgeCube'
        type: string
      homepage:
        description: 'Homepage URL'
        required: false
        default: 'https://openjdk.org/'
        type: string
      repository:
        description: 'Repository URL'
        required: false
        default: 'https://github.com/venti1112/EdgeCubePackage-JRE'
        type: string
      update-url:
        description: 'Update check URL (optional)'
        required: false
        type: string
      min-app-version:
        description: 'Minimum EdgeCube app version'
        required: false
        default: 15
        type: number

jobs:
  build_android:
    strategy:
      matrix:
        arch: [ "aarch32", "aarch64", "x86", "x86_64" ]
      fail-fast: false

    name: "Build for Android ${{matrix.arch}}"
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Build with CI build script
      run: bash "ci_build_arch_${{matrix.arch}}.sh"

    - name: Upload JRE build output
      uses: actions/upload-artifact@v4
      with:
        name: 'jre17-${{matrix.arch}}'
        path: jre17*.tar.xz

  package:
    needs: build_android
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Get jre17-aarch32
      uses: actions/download-artifact@v4
      with:
        name: jre17-aarch32
        path: fcl

    - name: Get jre17-aarch64
      uses: actions/download-artifact@v4
      with:
        name: jre17-aarch64
        path: fcl

    - name: Get jre17-x86
      uses: actions/download-artifact@v4
      with:
        name: jre17-x86
        path: fcl

    - name: Get jre17-x86_64
      uses: actions/download-artifact@v4
      with:
        name: jre17-x86_64
        path: fcl

    - name: Repack JRE
      run: bash "repack_jre.sh" $GITHUB_WORKSPACE/fcl $GITHUB_WORKSPACE/fcl/jre17-multiarch

    - name: Pack ecpkg
      run: bash "pack_ecpkg.sh" $GITHUB_WORKSPACE/fcl/jre17-multiarch $GITHUB_WORKSPACE/fcl/jre17-ecpkg
      env:
        ECPKG_VERSION: ${{ inputs.version }}
        ECPKG_VERSION_NAME: ${{ inputs.version-name }}
        ECPKG_ID: ${{ inputs.ecpkg-id }}
        ECPKG_NAME: ${{ inputs.ecpkg-name }}
        ECPKG_DESCRIPTION: ${{ inputs.description }}
        ECPKG_AUTHOR: ${{ inputs.author }}
        ECPKG_HOMEPAGE: ${{ inputs.homepage }}
        ECPKG_REPOSITORY: ${{ inputs.repository }}
        ECPKG_UPDATE_URL: ${{ inputs.update-url }}
        ECPKG_MIN_APP_VERSION: ${{ inputs.min-app-version }}

    - name: Upload ecpkg packages
      uses: actions/upload-artifact@v4
      with:
          name: jre17-ecpkg
          path: fcl/jre17-ecpkg/*.ecpkg
